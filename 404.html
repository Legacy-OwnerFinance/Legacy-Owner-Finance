  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Legacy - Owner Finance | Brokerage By: KLC Real Estate, LLC</title>
  <script>
    (function() {
      var fallback = "https://finish-screenshots-broadcast-slowly.trycloudflare.com";
      var prefix = "/Legacy-Owner-Finance";
      var rawPath = window.location.pathname || "/";
      var subPath = rawPath.indexOf(prefix) === 0 ? rawPath.slice(prefix.length) : rawPath;
      if (!subPath || subPath === "/index.html" || subPath === "/app.html") {
        subPath = "";
      }
      var pathParam = new URLSearchParams(window.location.search).get("p") || "";
      var suffix = pathParam
        ? pathParam
        : subPath + (window.location.search || "") + (window.location.hash || "");
      var apiUrl = "https://api.github.com/repos/TheRivasLegacyGroup/Legacy-Owner-Finance/contents/tunnel-url.json?t=" + Date.now();
      var rawUrl = "https://raw.githubusercontent.com/TheRivasLegacyGroup/Legacy-Owner-Finance/main/tunnel-url.json?t=" + Date.now();
      fetch(apiUrl, { cache: "no-store", headers: { "Accept": "application/vnd.github.v3+json" } })
        .then(function(r) { if (!r.ok) throw new Error("api"); return r.json(); })
        .then(function(meta) {
          var decoded = JSON.parse(atob((meta.content || "").replace(/\s/g, "")));
          var target = (decoded && decoded.url) ? decoded.url : fallback;
          window.location.replace(target + suffix);
        })
        .catch(function() {
          fetch(rawUrl, { cache: "no-store" })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var target = (data && data.url) ? data.url : fallback;
              window.location.replace(target + suffix);
            })
            .catch(function() {
              window.location.replace(fallback + suffix);
            });
        });
    })();
  </script>
